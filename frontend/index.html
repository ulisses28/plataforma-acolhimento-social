<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsividade para celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título principal que aparece na aba do navegador e pode aparecer no Google -->
    <title>Lar Batista Albertine Meador | Plataforma de Acolhimento Social</title>

    <!-- Descrição principal da página inicial -->
    <meta
      name="description"
      content="O Lar Batista Albertine Meador acolhe crianças e jovens em situação de vulnerabilidade social. Conheça projetos sociais, ações solidárias, transparência, governança, notícias, parceiros e formas de contribuir."
    />

    <!-- Autor institucional -->
    <meta name="author" content="Lar Batista Albertine Meador" />

    <!-- Permite indexação da página -->
    <meta name="robots" content="index, follow" />

    <!-- URL oficial que queremos consolidar no Google -->
    <meta
      property="og:url"
      content="https://www.larbatistaalbertinemeador.com.br/"
    />

    <!-- Favicon oficial do site -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    
    <!-- Cor do navegador em dispositivos móveis -->
    <meta name="theme-color" content="#0B3D91" />

    <!-- Open Graph: melhora prévia quando o link é compartilhado -->
    <meta
      property="og:title"
      content="Lar Batista Albertine Meador | Plataforma de Acolhimento Social"
    />

    <meta
      property="og:description"
      content="Conheça a Plataforma de Acolhimento Social do Lar Batista Albertine Meador: projetos, notícias, transparência, parceiros, voluntariado e formas de contribuição."
    />

    <meta
      property="og:url"
      content="https://www.larbatistaalbertinemeador.com.br/"
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Imagem de compartilhamento. Precisa existir dentro da pasta public -->
    <meta
      property="og:image"
      content="https://www.larbatistaalbertinemeador.com.br/og-lar-batista.png"
    />

    <meta
      property="og:image:alt"
      content="Logo do Lar Batista Albertine Meador"
    />

    <!-- Twitter / WhatsApp / redes sociais que usam cards -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Lar Batista Albertine Meador | Plataforma de Acolhimento Social"
    />

    <meta
      name="twitter:description"
      content="Acolhimento, cuidado, solidariedade e transformação social para crianças e jovens em situação de vulnerabilidade social."
    />

    <meta
      name="twitter:image"
      content="https://www.larbatistaalbertinemeador.com.br/og-lar-batista.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
